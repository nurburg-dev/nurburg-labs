test_name: Cursor Pagination API Tests

stages:
  - name: Healthcheck returns 200
    request:
      url: "{tavern.env_vars.HOST}/healthcheck"
      method: GET
    response:
      status_code: 200

  - name: First page returns products and a next_cursor
    request:
      url: "{tavern.env_vars.HOST}/products?limit=20"
      method: GET
    response:
      status_code: 200
      json:
        products: !anylist
        next_cursor: !anystr
        limit: !anyint

  - name: Deep cursor returns non-empty products (fails with OFFSET, passes with keyset)
    request:
      url: "{tavern.env_vars.HOST}/products?cursor=490000&limit=20"
      method: GET
    response:
      status_code: 200
      json:
        products:
          - !anything
