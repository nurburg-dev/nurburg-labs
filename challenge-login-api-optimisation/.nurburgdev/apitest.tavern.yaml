test_name: Wrong password returns 401

stages:
  - name: Wrong password returns 401
    request:
      url: "{tavern.env_vars.HOST}/auth/login"
      method: POST
      json:
        email: "yvette52@example.org"
        password: "wrongpassword"
    response:
      status_code: 401
