description = "Implement the transactional outbox pattern to reliably publish events to Kafka after a database write."

[[service]]
name = "order-service"
runtime = "nodejs"
port = 3000
healthCheckUrl = "/healthcheck"
cpuCores = 0.5
memoryMB = 512
instances = 1
directory = "order-service"
env = { DATABASE_URL = "postgresql://user:password@pg-orders:5432/orderdb", KAFKA_BROKERS = "kafka:9092", PORT = "3000", HOOKS_CONFIG_V1_ENV_VAR = "IHsgInBvc3RncmVzcWwiOiBbeyJ0eXBlIjogImVycm9yZWRfY29tbWl0IiwgImVycm9yQ291bnQiOiAyLCAiZXJyb3JQcm9iYWJpbGl0eSI6IDF9XX0=" }

[[postgres]]
name = "pg-orders"
cpuCores = 0.5
memoryMB = 512
storageGB = 5
dbName = "orderdb"
user = "user"
password = "password"

[[service]]
name = "ledger-service"
runtime = "nodejs"
port = 4000
healthCheckUrl = "/healthcheck"
cpuCores = 0.5
memoryMB = 512
instances = 1
directory = "ledger-service"
env = { DATABASE_URL = "postgresql://user:password@pg-ledger:5432/ledgerdb", KAFKA_BROKERS = "kafka:9092", PORT = "4000" }


[[postgres]]
name = "pg-ledger"
cpuCores = 0.5
memoryMB = 512
storageGB = 5
dbName = "ledgerdb"
user = "user"
password = "password"

[[dataseeder]]
file = "ledger-service/schema.sql"
targetName = "pg-ledger"

[[dataseeder]]
file = "order-service/schema.sql"
targetName = "pg-orders"

[[kafka]]
name = "kafka"
cpuCores = 0.5
memoryMB = 512
storageGB = 5
brokers = 1
topics = [{ name = "outbox-events", partition = 3, replicationFactor = 1 }]

[[traffic]]
file = ".nurburgdev/traffic.js"
cpuCores = 0.5
memoryMB = 256
targetName = "order-service"
env = { HOST_ORDER = "http://order-service:3000" }

[apitest]
file = ".nurburgdev/apitest.tavern.yaml"
env = { HOST_ORDER = "http://order-service:3000", HOST_LEDGER = "http://ledger-service:4000" }

[[score]]
name = "FUNC_TEST"
taskName = "apitest-0"
threshold = 100.0

[[score]]
name = "ERR_RATE"
taskName = "traffic"
threshold = 5.0

[[score]]
name = "LATENCY_95"
taskName = "traffic"
threshold = 500.0

[[telemetry]]
name = ["POD_CPU", "POD_MEMORY"]
componentName = "order-service"

[[telemetry]]
name = ["POD_CPU", "POD_MEMORY"]
componentName = "ledger-service"

[[telemetry]]
name = ["POD_CPU", "POD_MEMORY", "QUERY_RATE", "ACTIVE_CONNECTIONS"]
componentName = "pg-orders"

[[telemetry]]
name = ["POD_CPU", "POD_MEMORY", "QUERY_RATE", "ACTIVE_CONNECTIONS"]
componentName = "pg-ledger"

[[telemetry]]
name = ["POD_CPU", "POD_MEMORY", "MESSAGES_IN_RATE", "BYTES_IN_RATE", "BYTES_OUT_RATE", "CONSUMER_GROUP_LAG"]
componentName = "kafka"
