description = "Implement PostgreSQL table partitioning on a high-volume transaction log to eliminate full-table scans on date-range analytics queries."

[[service]]
name = "challenge"
runtime = "nodejs"
port = 3000
healthCheckUrl = "/healthcheck"
cpuCores = 0.5
memoryMB = 512
instances = 1
env = {DB_HOST = "postgresdb", DB_PORT = "5432", DB_NAME = "transactiondb", DB_USER = "user", DB_PASSWORD = "password", PORT = "3000"}

[[postgres]]
name = "postgresdb"
cpuCores = 1
memoryMB = 1024
storageGB = 20
dbName = "transactiondb"
user = "user"
password = "password"

[[dataseeder]]
name = "schemaseeder"
file = "schema.sql"
targetName = "postgresdb"

[[dataseeder]]
name = "dataseeder"
url = "https://nurburg-dev-fluentbit.s3.eu-central-1.amazonaws.com/0005-transactions.csv"
targetName = "postgresdb"
targetTable = "transaction_logs"
dependsOn = ["schemaseeder"]

[[traffic]]
file = ".nurburgdev/traffic.js"
cpuCores = 0.5
memoryMB = 256
env = {HOST = "http://challenge:3000"}

[apitest]
file = ".nurburgdev/apitest.tavern.yaml"
env = { HOST = "http://challenge:3000" }

[[score]]
name = "FUNC_TEST"
taskName = "apitest"
threshold = 100.0

[[score]]
name = "ERR_RATE"
taskName = "traffic"
threshold = 5.0

[[score]]
name = "LATENCY_95"
taskName = "traffic"
threshold = 1000.0

[[telemetry]]
name = ["POD_CPU", "POD_MEMORY"]
componentName = "challenge"

[[telemetry]]
name = ["POD_CPU", "POD_MEMORY", "QUERY_RATE", "ACTIVE_CONNECTIONS"]
componentName = "postgresdb"
